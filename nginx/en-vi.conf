# Nginx config cho www.donghanhcungban.org (Tất cả domain khác 301 redirect về www.donghanhcungban.org)
# Copy lên VPS: sudo cp nginx/en-vi.conf /etc/nginx/sites-available/donghanhcungban
# Rồi: sudo ln -sf /etc/nginx/sites-available/donghanhcungban /etc/nginx/sites-enabled/
# Và: sudo nginx -t && sudo systemctl reload nginx
#
# NẾU dùng Cloudflare trước VPS (xem docs/cloudflare-setup.md): dòng "include
# /etc/nginx/cloudflare-realip.conf" bên dưới BẮT BUỘC phải có file đó tồn tại
# trước (chạy scripts/update-cloudflare-ips.sh 1 lần), nếu không "nginx -t" sẽ
# lỗi. Chưa dùng Cloudflare thì COMMENT dòng include đó lại.
#
# Chiến lược cache:
#   - /js/, /assets/ → Nginx serve trực tiếp từ dist/ (bypass Express hoàn toàn)
#     File có hash trong tên → cache immutable 1 năm
#   - /uploads/      → Nginx serve trực tiếp từ uploads/ (file audio TTS)
#   - /api/          → proxy về Express (Node.js xử lý)
#   - /index.html    → proxy Express, NO cache (luôn lấy bản mới sau deploy)

# ── QUY TẮC TÊN MIỀN (chốt 2026-08-24) ───────────────────────────────────────────────────────
#
#   PHỤC VỤ THẬT (không bao giờ redirect đi):
#     · www.donghanhcungban.org      → trang hub nền tảng
#     · en-vi.donghanhcungban.org    → app môn tiếng Anh
#     (Express chọn app theo header Host, xem EN_VI_HOSTNAME trong .env.example)
#
#   301 REDIRECT (giữ nguyên path qua $request_uri):
#     · donghanhcungban.org (apex, không www) → https://www.donghanhcungban.org
#     · donghanhcungban.com, www.donghanhcungban.com → https://www.donghanhcungban.org
#     · en-vi.donghanhcungban.com → https://en-vi.donghanhcungban.org  (ĐÚNG subdomain, KHÔNG về hub)
#
# ⚠️ ĐỪNG gộp en-vi.donghanhcungban.org vào nhóm redirect. Bản trước của file này có lỗi đó
#    (commit 7bbb1a7) — áp lên VPS là app tiếng Anh chết vì bị đẩy hết về hub.

# ── 1a. HTTP :80 cho domain PHỤC VỤ → lên HTTPS, GIỮ NGUYÊN host ─────────────────────────────
server {
    listen 80;
    server_name www.donghanhcungban.org en-vi.donghanhcungban.org hub.donghanhcungban.org hoc-tap.donghanhcungban.org run.donghanhcungban.org;
    server_tokens off;
    # $host chứ KHÔNG phải www cố định — nếu ép về www thì en-vi qua HTTP sẽ mất subdomain.
    return 301 https://$host$request_uri;
}

# ── 1b. HTTP :80 cho domain KHÔNG chuẩn → thẳng tới HTTPS canonical tương ứng ─────────────────
server {
    listen 80;
    server_name donghanhcungban.org donghanhcungban.com www.donghanhcungban.com;
    server_tokens off;
    return 301 https://www.donghanhcungban.org$request_uri;
}

server {
    listen 80;
    server_name en-vi.donghanhcungban.com;
    server_tokens off;
    return 301 https://en-vi.donghanhcungban.org$request_uri;
}

# ── 2a. HTTPS :443 — apex .org → www.org (ĐÂY là "điều hướng domain gốc") ────────────────────
server {
    listen 443 ssl http2;
    server_name donghanhcungban.org;
    server_tokens off;

    # Cert phải phủ chính apex. Certbot cấp kèm khi chạy:
    #   certbot --nginx -d donghanhcungban.org -d www.donghanhcungban.org -d en-vi.donghanhcungban.org
    ssl_certificate /etc/letsencrypt/live/donghanhcungban.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donghanhcungban.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.donghanhcungban.org$request_uri;
}

# ── 2b. HTTPS :443 — domain .com cũ → .org tương ứng ─────────────────────────────────────────
# CHỨNG CHỈ: dùng CHUNG một cert với block phục vụ, miễn là cert đó phủ đủ 6 tên miền. Trên VPS
# hiện tại đúng như vậy (xác nhận 2026-08-24: cả 6 domain trả 200 qua HTTPS, tức không domain nào
# lỗi TLS → cert đã có đủ SAN). Kiểm lại bất cứ lúc nào bằng: sudo certbot certificates
#
# Vì sao phải để ý: bắt tay TLS xảy ra TRƯỚC HTTP, nên nếu cert KHÔNG phủ tên miền đang bị
# redirect thì trình duyệt báo lỗi bảo mật trước khi kịp đọc `return 301`.
server {
    listen 443 ssl http2;
    server_name donghanhcungban.com www.donghanhcungban.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/donghanhcungban.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donghanhcungban.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.donghanhcungban.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name en-vi.donghanhcungban.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/donghanhcungban.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donghanhcungban.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://en-vi.donghanhcungban.org$request_uri;
}

# ── HỌC TẬP: hoc-tap.donghanhcungban.org — CƠ CHẾ ĐÃ GỠ (2026-09-20) ───────────────────────
# Góc học tập KHÔNG còn host riêng: mọi môn dùng path `/goc-hoc-tap/<mã môn>` trên host chính
# (`www.donghanhcungban.org`). Luật chuyển hướng theo hostname trong Express đã bị xoá cùng
# `apps/server/src/subjectsRouting.ts`.
# `hoc-tap.donghanhcungban.org` vẫn được GIỮ trong `server_name` bên dưới (chứng chỉ đã cấp,
# link cũ đã chia sẻ): host đó nay chỉ phục vụ app như mọi host khác, nên `hoc-tap…/goc-hoc-tap/
# physics` vẫn mở đúng bài. Muốn dọn hẳn thì bỏ tên khỏi `server_name` và thêm một block 301
# sang `www` — việc TAY trên VPS, không bắt buộc.

# ── HUB: hub.donghanhcungban.org ────────────────────────────────────────────────────────────
# [2026-08-28] Landing giới thiệu nền tảng (`apps/hub`) nay có host riêng. KHÔNG cần block
# server riêng: block phục vụ bên dưới đã `proxy_set_header Host $host`, nên Express nhận đúng
# hostname và tự chọn `apps/hub/dist` (biến HUB_HOSTNAME, xem apps/server/src/server.ts).
# Việc TAY còn lại trên VPS, theo đúng thứ tự:
#   1. Cloudflare: thêm bản ghi A `hub` trỏ về IP VPS (người dùng tự làm).
#   2. Mở rộng chứng chỉ cho tên mới — cert hiện tại KHÔNG phủ `hub.`:
#        sudo certbot --nginx -d hub.donghanhcungban.org --expand
#      Chạy TRƯỚC khi reload với server_name mới, nếu không `nginx -t` sẽ than thiếu cert.
#   3. sudo nginx -t && sudo systemctl reload nginx

# ── 3. HTTPS :443 — BLOCK PHỤC VỤ THẬT (hub + app tiếng Anh) ─────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.donghanhcungban.org en-vi.donghanhcungban.org hub.donghanhcungban.org hoc-tap.donghanhcungban.org;
    server_tokens off;

    client_max_body_size 10M;

    # ── Cloudflare: chỉ tin IP thật của trình duyệt khi request đến từ Cloudflare ──
    include /etc/nginx/cloudflare-realip.conf;

    # SSL Certbot
    ssl_certificate /etc/letsencrypt/live/donghanhcungban.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donghanhcungban.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Thư mục gốc của React build — Nginx đọc file từ đây cho /js/, /assets/
    root /var/www/dhcb/dist;

    # ── CSP: KHÔNG khai báo ở đây ──
    # Nguồn CSP duy nhất là Express (CSP_HEADER trong apps/server/src/routes.ts), đính vào
    # MỌI response — API, static và health — qua applyCommonSecurityHeaders().
    # Trước đây chỗ này có một bản Content-Security-Policy-Report-Only riêng; nó đã lạc hậu
    # (còn whitelist *.supabase.co dù dự án rời Supabase từ 2026-07-20, lại thiếu
    # facebook/apple/microsoft, media-src blob:, frame-src accounts.google.com) nên chỉ sinh
    # báo cáo vi phạm GIẢ. Hai bản CSP song song luôn trôi lệch nhau — giữ đúng một bản.
    # Audit 2026-08-25, F5.

    # ── Tối ưu file I/O ───────────────────────────────────────────────────────
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Phục vụ file .gz/.br đã nén sẵn (Vite build tạo ra) trước khi gzip on-the-fly
    gzip_static on;

    # ── /js/ và /assets/ — static files có hash, bypass Express hoàn toàn ─────
    location ~* ^/(js|assets)/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";

        sendfile on;
        tcp_nopush on;
        access_log off;
    }

    # ── /uploads/ — file audio TTS ────────────────────────────────────────────
    location /uploads/ {
        alias /var/www/dhcb/uploads/;
        add_header Cache-Control "public, max-age=2592000";  # 30 ngày
        add_header Access-Control-Allow-Origin "*";
        add_header Vary "Accept-Encoding";
        sendfile on;
        tcp_nopush on;
        access_log off;
    }

    # ── /favicon.ico, /robots.txt, /manifest.json — cache 1 tuần ────────────
    location ~* \.(ico|txt|webmanifest|json)$ {
        try_files $uri @express;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ── /api/ — proxy về Express (Node.js) ───────────────────────────────────
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # GHI ĐÈ cả ba header IP bằng $remote_addr (đã qua real_ip của Cloudflare). real_ip chỉ đổi
        # biến $remote_addr, KHÔNG xoá header client tự gửi — không ghi đè thì ai gọi thẳng IP VPS
        # vẫn chuyển được CF-Connecting-IP giả tới Express (lỗ hổng vá 2026-09-27).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── / (tất cả còn lại) — index.html KHÔNG cache ──────────────────────────
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # GHI ĐÈ cả ba header IP bằng $remote_addr (đã qua real_ip của Cloudflare). real_ip chỉ đổi
        # biến $remote_addr, KHÔNG xoá header client tự gửi — không ghi đè thì ai gọi thẳng IP VPS
        # vẫn chuyển được CF-Connecting-IP giả tới Express (lỗ hổng vá 2026-09-27).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Fallback: nếu try_files không tìm thấy file tĩnh thì chạy Express
    location @express {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Cùng bộ ghi đè IP như hai location trên — thiếu X-Real-IP ở đây thì client tự khai được.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 4. HTTPS :443 — HOST CHẠY CODE HỌC VIÊN run.donghanhcungban.org ──────────────────────────
# Đặc tả: docs/specs/2026-10-10-tach-runtime-chay-code-ten-mien-con.md. Trang runner.html chạy
# code học viên ở origin riêng nên phải "nghèo" nhất có thể:
#   · KHÔNG phục vụ file tĩnh trực tiếp ở đây (khác block 3): MỌI request đi qua Express để
#     nhận đúng CSP riêng của runner + danh sách trắng đường dẫn (apps/server/src/runnerHost.ts).
#     Một nguồn header duy nhất — y như lý do CSP không khai ở block 3. Worker lấy CSP từ chính
#     response của file JS, nên file JS cũng phải mang header.
#   · XOÁ Cookie trước khi chuyển tiếp: cookie phiên đặt Domain=.donghanhcungban.org nên trình
#     duyệt vẫn gửi nó tới run.; Express không cần, và không để nó chạm tới tiến trình nào ở host
#     này. (Host runner cũng không có /api — Express trả 404.)
# Trước khi bật: Cloudflare thêm bản ghi `run` (proxied) + mở rộng chứng chỉ:
#   sudo certbot --nginx -d run.donghanhcungban.org --expand
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 443 ssl http2;
    server_name run.donghanhcungban.org;
    server_tokens off;

    # Chỉ GET/HEAD file tĩnh — không cần body lớn.
    client_max_body_size 16k;

    include /etc/nginx/cloudflare-realip.conf;

    ssl_certificate /etc/letsencrypt/live/donghanhcungban.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donghanhcungban.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
