<!doctype html>
<html lang="vi" data-theme="blue-sky">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Cho phép người học phóng to; font input cảm ứng vẫn ≥16px để tránh iOS tự zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- data-theme + theme-color ở đây PHẢI khớp theme mặc định Blue sky (packages/core-ui/theme.ts);
         test apps/dhcb/src/lib/publicMetadata.test.ts canh. -->
    <meta name="theme-color" content="#f0f9ff" />
    <!-- Chống nhá màu trước khi JS chính chạy (audit 2026-09-30 M13): đọc theme đã chọn, chưa chọn
         thì theo chế độ sáng/tối của máy — CÙNG luật với getTheme() ở packages/core-ui/theme.ts
         (khoá 'ui_theme' + danh sách theme hợp lệ; test publicMetadata canh hai nơi khớp nhau).
         main.tsx gọi applyTheme() ngay sau đó và cập nhật cả meta theme-color. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('ui_theme')
          if (t !== 'blue-sky' && t !== 'dark-blue' && t !== 'kid') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark-blue' : 'blue-sky'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          /* localStorage/matchMedia bị chặn — giữ Blue sky mặc định */
        }
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Thẻ chuẩn mới (trình duyệt hiện đại); thẻ apple- bên dưới giữ cho iOS Safari cũ -->

    <!-- JSON-LD Structured Data for SEO (WebSite, WebApplication, EducationalOrganization, Course) -->

            "url": "https://www.donghanhcungban.org",
            "applicationCategory": "EducationalApplication",
            "inLanguage": ["vi", "en"],
            "operatingSystem": "Web, iOS, Android, PWA",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "VND"
            }
          },
          {
            "@type": "EducationalOrganization",
            "@id": "https://www.donghanhcungban.org/#organization",
            "name": "Đồng Hành Cùng Bạn",
            "url": "https://www.donghanhcungban.org",
            "logo": "https://www.donghanhcungban.org/icon-512.png",
            "sameAs": ["https://github.com/seeker19110/dhcb"]
          },
          {
            "@type": "Course",
            "@id": "https://www.donghanhcungban.org/#course-cefr",
            "name": "Lộ trình Tiếng Anh CEFR từ A1 đến C2 cùng Gia sư AI",
            "description": "Khóa học tiếng Anh toàn diện theo khung chuẩn châu Âu CEFR A1-C2, học từ vựng SRS, luyện phát âm AI, chấm bài viết IELTS.",
            "provider": {
              "@type": "EducationalOrganization",
              "name": "Đồng Hành Cùng Bạn"
            },
            "inLanguage": "vi",
            "hasCourseInstance": {
              "@type": "CourseInstance",
              "courseMode": "online",
              "instructor": {

    <!-- FAQ Schema for search result snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Đồng Hành Cùng Bạn gồm những gì?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Hai trụ: Học tập và Ghi chú, cùng Bạn Đồng Hành — người bạn AI nhớ ngữ cảnh việc học của bạn. Trụ Học tập có môn Tiếng Anh (lộ trình CEFR A1–C2), môn Lập trình và bốn môn Toán, Vật lý, Hoá học, Sinh học."
            }
          },
          {
            "@type": "Question",
            "name": "Môn Tiếng Anh có những tính năng gì?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Trò chuyện với gia sư AI (sửa lỗi kèm giải thích bằng tiếng Việt); luyện nói song ngữ — AI trả lời bằng giọng tiếng Anh chuẩn và sửa lỗi bằng giọng tiếng Việt; luyện viết chấm điểm kiểu IELTS; thẻ từ vựng ôn tập ngắt quãng, từ điển, mẫu câu thông dụng và truyện song ngữ."
            }
          },
          {
            "@type": "Question",
            "name": "Có học được khi không có mạng không?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Được với phần dữ liệu bài học. Khi bạn đã đăng nhập và học ít nhất một phiên, ứng dụng tải dần dữ liệu môn Tiếng Anh (từ điển, bài học, mẫu câu, truyện) về máy để mở lại khi mất mạng. Ứng dụng không tải khi máy bật chế độ tiết kiệm dữ liệu, và bạn có thể tắt mục \"Tải để học ngoại tuyến\" trong Cài đặt. Các tính năng dùng AI (trò chuyện, luyện nói, chấm bài viết) vẫn cần mạng."
            }
          },
          {
            "@type": "Question",
            "name": "Ứng dụng có miễn phí không?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Có. Bạn có thể bắt đầu không cần đăng nhập, với các tính năng AI dùng thử có hạn mức. Tài khoản Miễn phí có lượt AI mỗi ngày theo hạn mức hiển thị trong ứng dụng. VIP cho phép tự chọn bài trong nội dung đã mở và không giới hạn lượt AI trong thời gian gói còn hiệu lực."
            }
          }
        ]
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
