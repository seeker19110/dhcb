<!doctype html>
<html lang="vi" data-theme="dark-blue">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Cho phép người học phóng to; font input cảm ứng vẫn ≥16px để tránh iOS tự zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1726" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Thẻ chuẩn mới (trình duyệt hiện đại); thẻ apple- bên dưới giữ cho iOS Safari cũ -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Đồng Hành" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="robots" content="index, follow" />
    <title>
      Đồng Hành Cùng Bạn — Nền tảng đồng hành cá nhân | Học tập · Sự nghiệp · Công việc · Khởi
      nghiệp · Đời sống
    </title>
    <meta
      name="description"
      content="Đồng Hành Cùng Bạn — nền tảng đồng hành cá nhân gồm năm trụ: Học tập, Sự nghiệp, Công việc, Khởi nghiệp, Đời sống, cùng Bạn Đồng Hành (AI hiểu ngữ cảnh cả năm trụ). Trụ Học tập có môn Tiếng Anh theo lộ trình CEFR A1–C2 và môn Lập trình."
    />
    <meta
      name="keywords"
      content="đồng hành cùng bạn, nền tảng đồng hành cá nhân, phát triển bản thân, học tập, sự nghiệp, công việc, khởi nghiệp, đời sống, gia sư AI, gia sư tiếng Anh AI, học lập trình, luyện nói tiếng Anh, IELTS"
    />
    <!-- Open Graph for social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Đồng Hành Cùng Bạn — Nền tảng đồng hành cá nhân" />
    <meta
      property="og:description"
      content="Năm trụ — Học tập, Sự nghiệp, Công việc, Khởi nghiệp, Đời sống — trong một hồ sơ, cùng một người bạn AI hiểu ngữ cảnh cả năm."
    />
    <meta property="og:url" content="https://www.donghanhcungban.org" />
    <!-- SVG không render tốt trên nhiều nền tảng social — dùng icon-512.png (raster) thay favicon.svg.
         Chưa có ảnh 1200×630 chuyên dụng cho social card — cần thiết kế riêng sau (ghi ở PROGRESS.md). -->
    <meta property="og:image" content="https://www.donghanhcungban.org/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Đồng Hành Cùng Bạn — Nền tảng đồng hành cá nhân" />
    <meta
      name="twitter:description"
      content="Học tập · Ghi chú — các trụ trong một hồ sơ, cùng Bạn Đồng Hành."
    />
    <meta name="twitter:image" content="https://www.donghanhcungban.org/icon-512.png" />
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.donghanhcungban.org/" />
    <!-- hreflang: bilingual SEO (supports both VI & EN interfaces) -->
    <link rel="alternate" hreflang="vi" href="https://www.donghanhcungban.org" />
    <link rel="alternate" hreflang="en" href="https://www.donghanhcungban.org" />
    <link rel="alternate" hreflang="x-default" href="https://www.donghanhcungban.org" />
    <!-- Preconnect to speed up initial latency for AI & storage -->
    <link rel="preconnect" href="https://api.groq.com" crossorigin />
    <link rel="preconnect" href="https://api.openai.com" crossorigin />
    <link rel="preconnect" href="https://api.anthropic.com" crossorigin />
    <link rel="preconnect" href="https://api.sentry.io" crossorigin />
    <!-- Font Inter tự host cùng domain (xem src/main.tsx) — không còn phụ thuộc Google Fonts -->
  </head>
  <body>
    <div id="root"></div>
    <!-- JSON-LD Structured Data for SEO -->
    <!-- JSON-LD Structured Data for SEO (WebSite, WebApplication, EducationalOrganization, Course) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://www.donghanhcungban.org/#app",
            "name": "Đồng Hành Cùng Bạn — Nền tảng đồng hành cá nhân",
            "description": "Nền tảng đồng hành cá nhân gồm năm trụ (Học tập, Sự nghiệp, Công việc, Khởi nghiệp, Đời sống) với tác tử AI Bạn Đồng Hành xuyên suốt. Trụ Học tập hiện có môn Tiếng Anh (CEFR A1–C2, luyện nói/viết/nghe, SRS, học ngoại tuyến) và môn Lập trình.",
            "url": "https://www.donghanhcungban.org",
            "applicationCategory": "EducationalApplication",
            "inLanguage": ["vi", "en"],
            "operatingSystem": "Web, iOS, Android, PWA",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "VND"
            }
          },
          {
            "@type": "EducationalOrganization",
            "@id": "https://www.donghanhcungban.org/#organization",
            "name": "Đồng Hành Cùng Bạn",
            "url": "https://www.donghanhcungban.org",
            "logo": "https://www.donghanhcungban.org/icon-512.png",
            "sameAs": ["https://github.com/seeker19110/dhcb"]
          },
          {
            "@type": "Course",
            "@id": "https://www.donghanhcungban.org/#course-cefr",
            "name": "Lộ trình Tiếng Anh CEFR từ A1 đến C2 cùng Gia sư AI",
            "description": "Khóa học tiếng Anh toàn diện theo khung chuẩn châu Âu CEFR A1-C2, học từ vựng SRS, luyện phát âm AI, chấm bài viết IELTS.",
            "provider": {
              "@type": "EducationalOrganization",
              "name": "Đồng Hành Cùng Bạn"
            },
            "inLanguage": "vi",
            "hasCourseInstance": {
              "@type": "CourseInstance",
              "courseMode": "online",
              "instructor": {
                "@type": "Person",
                "name": "Bạn Đồng Hành (gia sư AI môn Tiếng Anh)"
              }
            }
          }
        ]
      }
    </script>
    <!-- FAQ Schema for search result snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Môn Tiếng Anh trên Đồng Hành Cùng Bạn có những tính năng gì?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Gia sư AI cung cấp 4 tính năng cốt lõi: (1) Trò chuyện AI (/tro-truyen) - sửa lỗi ngữ pháp & diễn đạt; (2) Luyện nói AI (/luyen-noi) - nhận diện giọng nói & chỉnh phát âm; (3) Luyện viết IELTS (/luyen-viet) - chấm điểm Band Score & gợi ý sửa bài; (4) Thẻ từ vựng SRS Offline (/luyen-tap) - ôn tập từ vựng không cần kết nối mạng qua IndexedDB/PWA."
            }
          },
          {
            "@type": "Question",
            "name": "Chế độ Học Offline SRS Flashcards hoạt động như thế nào?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Hệ thống tự động lưu trữ bộ thẻ SRS FSRS và tải trước âm thanh phát âm vào IndexedDB browser. Học viên có thể ôn tập từ vựng, nghe audio và đánh giá mức độ ghi nhớ ngay cả khi không có kết nối Internet."
            }
          },
          {
            "@type": "Question",
            "name": "Có những đường dẫn tiện ích công khai nào trên ứng dụng?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ứng dụng hỗ trợ các đường dẫn tiếng Việt tối ưu SEO: /lo-trinh-hoc (Lộ trình CEFR), /luyen-tap (SRS Flashcard), /tro-truyen (AI Chat), /luyen-noi (AI Speaking), /luyen-viet (AI Writing), /tu-dien (Từ điển 10k từ), /bai-hoc (Ngữ pháp), /cau-thong-dung (Mẫu câu giao tiếp), /thu-thach (Thử thách 1 phút)."
            }
          },
          {
            "@type": "Question",
            "name": "Ứng dụng có miễn phí không?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Có. Gói Miễn phí cung cấp các lượt học từ vựng, chat, nói và viết mỗi ngày. Học viên có thể nâng cấp gói Pro để dùng không giới hạn."
            }
          }
        ]
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
