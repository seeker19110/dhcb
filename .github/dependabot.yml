version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patch:
        dependency-type: production
        update-types: [patch]
    # Stack ghim cứng (CLAUDE.md mục 6): KHÔNG nâng React/TS/Tailwind/ESLint.
    # Chặn từ nguồn để dependabot đừng mở PR chắc chắn bị từ chối
    # (vd PR #656: eslint-plugin-react-refresh 0.5.x đòi ESLint 9 + flat config).
    ignore:
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-plugin-react-refresh
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@typescript-eslint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-plugin-react-hooks
        update-types: ['version-update:semver-major']
      # SDK 1.x đổi API version 2023-06-01 → 2026-10-21 và gửi khoá qua Authorization: Bearer
      # (thay x-api-key) — PR #1439 đỏ. Nâng có chủ đích theo nợ ở PROGRESS.md (changelog 0665).
      - dependency-name: '@anthropic-ai/sdk'
        update-types: ['version-update:semver-major']
      # 0.18.14 đổi sang @acemir/cssom, trường "browser" trỏ script không có export → build
      # worker domRunner vỡ (PR #1438). Chỉ chặn đúng bản này; bản sau vẫn được đề xuất.
      - dependency-name: linkedom
        versions: ['0.18.14']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
