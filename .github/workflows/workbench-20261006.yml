name: Read-only public release verification 20261006

on:
  push:
    branches: [workbench/learning-profile-20261006]
    paths: [.github/workflows/workbench-20261006.yml]

permissions:
  contents: read

jobs:
  public-smoke:
    if: github.repository == 'seeker19110/dhcb'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c00c79b27329b8e81838ee535a1d889f0bd5a3ef
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: source
      - run: npx playwright install --with-deps chromium
        working-directory: source
      - name: Wait for public policy marker during the already requested deployment
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          url = 'https://www.donghanhcungban.org/api/app-settings?release=20261006'
          for attempt in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.load(response)
                  if data.get('vipUnlimited') is True and 'vip-unlimited-20261006' in data.get('updatedAt', ''):
                      print('Public server now advertises the approved unlimited VIP policy.')
                      break
                  print(f'Attempt {attempt + 1}: deployment or CDN refresh not ready yet.')
              except Exception as error:
                  print(f'Attempt {attempt + 1}: public read unavailable: {type(error).__name__}')
              time.sleep(15)
          else:
              raise SystemExit('Could not verify deployed policy within this bounded check; inspect deployment separately.')
          PY
      - name: Inspect live pages without login, paid AI calls, password changes or user data
        working-directory: source
        run: |
          cp ../transfer/.workbench/smoke-public.mjs .smoke-public.mjs
          echo 'Expected deployment commit: c00c79b27329b8e81838ee535a1d889f0bd5a3ef'
          node .smoke-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-evidence-20261006
          path: source/public-evidence/
          retention-days: 2
          if-no-files-found: warn
