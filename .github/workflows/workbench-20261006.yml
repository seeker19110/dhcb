name: Prepare Google-only accessibility correction

on:
  push:
    branches: [workbench/learning-profile-20261006]
    paths: [.github/workflows/workbench-20261006.yml]

permissions:
  contents: write

jobs:
  correction:
    if: github.repository == 'seeker19110/dhcb'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aa35550d05b11b24cd5c7ae1cda14a29a441d53f
      - name: Correct expected provider, preserving every accessibility rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('e2e/a11y.spec.ts')
          text = p.read_text()
          old = "    await expect(page.getByRole('button', { name: /Microsoft/i })).toBeVisible()"
          new = "    await expect(page.getByRole('button', { name: /Google/i })).toBeVisible()\n    await expect(page.getByRole('button', { name: /Microsoft|Apple|Facebook/i })).toHaveCount(0)"
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
          git diff --check
          git add e2e/a11y.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(auth): cập nhật kiểm tra a11y cho đăng nhập chỉ Google'
          git push origin HEAD:refs/heads/workbench/auth-a11y-20261006
          git rev-parse HEAD
