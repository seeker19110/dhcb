name: Verify admin unlimited policy assertions

on:
  push:
    branches: [workbench/learning-profile-20261006]
    paths: [.github/workflows/workbench-20261006.yml]

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'seeker19110/dhcb'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5663f2ba48ade03d994845e1aea09572e1c989e
      - name: Update two obsolete expectations, keep quota and rollback assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('e2e/admin.spec.ts')
          s = p.read_text()
          start = s.index("  test('Limits: Hiện input Free và VIP'")
          end = s.index("  test('Limits: Bật checkbox khuyến mãi")
          assert s[start:end].count('  test(') == 2
          replacement = r'''  test('Limits: chỉ Free có ô hạn mức; VIP được mô tả không giới hạn', async ({ page }) => {
              await gotoAdmin(page, 'limits')
              await expect(page.getByLabel('Gói Free (lượt/ngày)')).toBeVisible({
                timeout: VISIBLE_TIMEOUT,
              })
              await expect(page.getByLabel('Gói VIP (lượt/ngày)')).toHaveCount(0)
              await expect(page.getByText(/VIP không giới hạn lượt AI\/ngày/)).toBeVisible()
            })

            test('Limits: Free=200; lưu thay đổi Free không làm mất cấu hình VIP cũ để rollback', async ({ page }) => {
              await gotoAdmin(page, 'limits')
              const freeInput = page.getByLabel('Gói Free (lượt/ngày)')
              await expect(freeInput).toHaveValue('200', { timeout: VISIBLE_TIMEOUT })
              await expect(page.locator('input[type="number"]')).toHaveCount(1)
              const posted = page.waitForRequest(
                (request) => request.url().endsWith('/api/admin-settings') && request.method() === 'POST',
              )
              await freeInput.fill('201')
              await page.getByRole('button', { name: 'Lưu cấu hình' }).first().click()
              expect((await posted).postDataJSON().limits).toEqual({ free: 201, vip: 999 })
            })

          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Format and publish correction to isolated branch only
        run: |
          npx prettier --write e2e/admin.spec.ts
          git diff --check
          git add e2e/admin.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(billing): kiểm tra VIP không giới hạn và giữ cấu hình Free'
          git push origin HEAD:refs/heads/workbench/admin-policy-20261006
          git rev-parse HEAD
      - run: npx playwright install --with-deps chromium
      - name: Verify the real admin form using mock API data
        run: npm run test:e2e -- e2e/admin.spec.ts --grep 'Limits:'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-policy-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 2
          if-no-files-found: warn
