name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

# Mỗi lần push mới lên một PR làm run của commit CŨ thành vô nghĩa, nhưng GitHub không tự
# huỷ chúng — để chúng chạy tiếp là đốt phút Actions cho một kết quả không ai đọc, vì thứ
# duy nhất branch protection nhìn là commit head. Thêm ở PR #703.
#
# KHÔNG phải bản vá cho vụ CI đứng im hôm 2026-08-26: vụ đó là sự cố Actions phía GitHub
# (major_outage), run kẹt trước cả hàng đợi nên huỷ cũng báo 409. Xem changelog 0165 —
# chẩn đoán đầu tiên quy nhầm cho chính chỗ thiếu này.
#
# cancel-in-progress CHỈ bật cho pull_request. Push lên main không bao giờ bị huỷ: lượt CI
# trên main là double-check trước khi deploy.yml chạy, huỷ nó là mất lưới an toàn cuối.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Validate title, evidence and feature spec
        uses: actions/github-script@v9
        with:
          script: |
            // ĐỌC PR SỐNG QUA API, KHÔNG dùng context.payload.pull_request.
            //
            // Payload là ẢNH CHỤP tại thời điểm sự kiện webhook, không phải trạng thái hiện
            // tại. Sửa mô tả PR cho đạt cổng rồi mà run vẫn đọc mô tả cũ thì cổng đánh trượt
            // oan; ngược lại, gỡ sạch mô tả sau khi cổng đã xanh thì nó không hề biết. Cả hai
            // chiều đều sai. Thấy thật ở PR #703 ngày 2026-08-26: Actions sự cố nên phát lại
            // hàng tồn, run tạo lúc 16:23 nhưng đọc mô tả lúc 15:56 — đỏ ba lượt liền vì một
            // lỗi đã sửa từ 16:08.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const title = pr.title;
            const body = pr.body || "";
            const conventional = /^(feat|fix|refactor|docs|test|chore|style|perf|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+/;
            if (!conventional.test(title)) {
              core.setFailed("Tiêu đề PR phải theo Conventional Commits, ví dụ: feat(learn): add review queue");
            }
            // Ký tự điều khiển / U+FFFD (mojibake) trong tiêu đề: regex trên chỉ soi TIỀN TỐ nên tiêu đề
            // hỏng vẫn qua, rồi thành tiêu đề commit trên main (changelog 0621, khung project-template).
            const CONTROL_OR_MOJIBAKE = /[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\uFFFD]/;
            if (CONTROL_OR_MOJIBAKE.test(title)) {
              core.setFailed("Tiêu đề PR chứa ký tự điều khiển hoặc U+FFFD (mojibake).");
            }

            if (pr.draft) {
              core.info("Draft PR: chưa bắt buộc hoàn tất evidence.");
              return;
            }

            // PR của dependabot: body do bot sinh (changelog upstream), không thể có 6 mục
            // evidence — trước đây mọi PR deps đều đỏ metadata và phải viết lại body tay
            // (xem PR #641). Chỉ giữ cổng tiêu đề Conventional Commits (đã kiểm ở trên);
            // an toàn thực chất do required check quality + e2e đảm nhiệm.
            if (pr.user.login === "dependabot[bot]") {
              core.info("PR dependabot: bỏ qua cổng evidence, chỉ kiểm tiêu đề.");
              return;
            }

            const required = [
              "## Tóm tắt",
              "## Issue / outcome",
              "## Research / spec",
              "## Validation",
              "## Rủi ro, rollout và rollback",
              "## Definition of Done"
            ];
            const missing = required.filter((heading) => !body.includes(heading));
            if (missing.length) {
              core.setFailed(`PR Ready for review còn thiếu: ${missing.join(", ")}`);
            }

            // SOI TỪNG COMMIT, không chỉ tiêu đề PR (changelog 0621, khung project-template B-01).
            // Repo đặt `squash_merge_commit_title = COMMIT_OR_PR_TITLE` (đọc qua API 2026-10-12): PR có
            // MỘT commit thì squash lấy TIÊU ĐỀ COMMIT làm tiêu đề trên main, không lấy tiêu đề PR. Nên
            // PR đặt tiêu đề `refactor:` mà commit duy nhất ghi `feat:` sẽ đưa `feat:` lên main mà KHÔNG
            // qua cổng đặc tả bên dưới; commit gõ `--no-verify` (bỏ commitlint ở máy) cũng lọt.
            // Bỏ qua merge commit (>1 cha): CLAUDE.md §11 cho gộp main vào nhánh khi xung đột, tiêu đề
            // "Merge branch 'main'…" không bao giờ thành tiêu đề squash. Trần 100 ký tự = commitlint ở máy.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const commitSubjects = commits
              .filter((c) => (c.parents || []).length <= 1)
              .map((c) => (c.commit.message || "").split("\n")[0]);
            const badSubjects = commitSubjects.filter(
              (s) => !conventional.test(s) || s.length > 100 || CONTROL_OR_MOJIBAKE.test(s)
            );
            if (badSubjects.length) {
              core.setFailed(
                "Mọi commit (trừ merge commit) phải theo Conventional Commits, ≤ 100 ký tự, không ký tự " +
                  "điều khiển — PR một commit thì squash lấy tiêu đề COMMIT lên main. Vi phạm: " +
                  badSubjects.join(" | ")
              );
            }

            // fix: không chạm TRAPS.md → chỉ CẢNH BÁO, không chặn: bug là một KHUÔN (sẽ tái phát) thì ghi
            // TRAPS.md trong cùng PR; lỗi gõ một lần thì không cần (`/learn`, changelog 0621).
            if ([title, ...commitSubjects].some((s) => /^fix(\(|:)/.test(s))) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              if (!files.some((f) => f.filename === "TRAPS.md")) {
                core.warning(
                  "PR fix: không chạm TRAPS.md — nếu bug này là một KHUÔN (không phải lỗi gõ một lần) thì thêm mục TRAPS.md trong cùng PR (xem /learn)."
                );
              }
            }

            // Cổng đặc tả soi CẢ tiêu đề PR LẪN tiêu đề từng commit (lý do ở khối trên).
            const featureSubjects = [title, ...commitSubjects].filter((s) => /^feat(\(|:)/.test(s));
            if (featureSubjects.length) {
              core.info(`Tiêu đề kiểu feat: ${featureSubjects.join(" | ")}`);
              // Chấp nhận CẢ HAI nơi đặt đặc tả của dự án:
              //   docs/specs/YYYY-MM-DD-slug.md  — spec theo tính năng (khuôn có sẵn)
              //   docs/research/<slug>.md        — đặc tả/nghiên cứu lộ trình lớn, vd
              //                                    dac-ta-kien-truc-platform-dhcb-2026-08-23.md
              // Trước đây cổng CHỈ nhận docs/specs/, trong khi CLAUDE.md mục 2 lại chỉ định
              // docs/research/*.md là nguồn thi hành — nên PR feat làm theo lộ trình luôn bị
              // chặn oan và phải viết spec bù cho qua cổng (xem PR #630).
              const specLink =
                /docs\/(?:specs\/\d{4}-\d{2}-\d{2}-[a-z0-9-]+|research\/[a-z0-9._-]+)\.md/g;
              const paths = [...body.matchAll(specLink)].map((m) => m[0]);

              if (paths.length === 0) {
                core.setFailed(
                  "PR feat phải liên kết đặc tả tại docs/specs/YYYY-MM-DD-slug.md hoặc docs/research/<slug>.md."
                );
              } else {
                // Bù lại chỗ nới lỏng: KIỂM FILE CÓ THẬT. Trước đây cổng chỉ dò chuỗi trong mô
                // tả PR nên gõ một đường dẫn không tồn tại vẫn qua — nới nơi đặt mà không kiểm
                // sự tồn tại thì cổng thành hình thức.
                const found = [];
                for (const path of [...new Set(paths)]) {
                  try {
                    await github.rest.repos.getContent({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      path,
                      ref: pr.head.sha,
                    });
                    found.push(path);
                  } catch (err) {
                    if (err.status !== 404) {
                      // Lỗi mạng/quyền — KHÔNG chặn oan một PR vốn hợp lệ, chỉ cảnh báo.
                      core.warning(`Không kiểm được ${path} (${err.status}): coi như hợp lệ.`);
                      found.push(path);
                    }
                  }
                }
                if (found.length === 0) {
                  core.setFailed(
                    `Đặc tả liên kết trong mô tả PR KHÔNG tồn tại trong nhánh này: ${[...new Set(paths)].join(", ")}`
                  );
                }
              }

              if (!/Approved for implementation/i.test(body)) {
                core.setFailed("PR feat phải xác nhận spec đã Approved for implementation.");
              }
            }
