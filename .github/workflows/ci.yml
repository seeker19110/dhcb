name: CI

# Cổng chất lượng: chạy trên MỌI pull request và mỗi lần push lên main.
# Chặn mã hỏng (lỗi type/lint/test/build) trước khi merge / trước khi deploy.yml chạy.
on:
  pull_request:
  push:
    branches: [main]

# Mỗi lần push mới lên một PR làm run của commit CŨ thành vô nghĩa, nhưng GitHub không tự
# huỷ chúng — để chúng chạy tiếp là đốt phút Actions cho một kết quả không ai đọc, vì thứ
# duy nhất branch protection nhìn là commit head. Thêm ở PR #703.
#
# KHÔNG phải bản vá cho vụ CI đứng im hôm 2026-08-26: vụ đó là sự cố Actions phía GitHub
# (major_outage), run kẹt trước cả hàng đợi nên huỷ cũng báo 409. Xem changelog 0165 —
# chẩn đoán đầu tiên quy nhầm cho chính chỗ thiếu này.
#
# cancel-in-progress CHỈ bật cho pull_request. Push lên main không bao giờ bị huỷ: lượt CI
# trên main là double-check trước khi deploy.yml chạy, huỷ nó là mất lưới an toàn cuối.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CẤU TRÚC (đổi 2026-08-27 — chia nhỏ để tăng tốc):
#   Trước: 2 job tuần tự dài (quality ~9 bước nối đuôi, e2e 1 worker chạy hết 563 test).
#   Nay:   các bước con chạy SONG SONG trên nhiều runner, rồi hai job TỔNG HỢP tên
#          `quality` và `e2e` gom kết quả lại.
#   Tên `quality` / `e2e` PHẢI GIỮ NGUYÊN: đó là required status check của branch
#   protection nhánh main (xem CLAUDE.md mục 13.6). Đổi tên = auto-merge kẹt vĩnh viễn.
jobs:
  # ── Nhánh 1: type + lint + format (không cần build) ────────────────────────
  static:
    name: Type + Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # khớp engines trong package.json (>=22)
          cache: npm
      - run: npm ci

      - name: Typecheck (frontend + API)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

  # ── Nhánh 2: unit test + coverage gate ─────────────────────────────────────
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Unit tests + coverage gate
        run: npm run test:coverage

  # ── Nhánh 3: build + ngân sách bundle + boot check ─────────────────────────
  build:
    name: Build + budget + boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build

      # Ngân sách hiệu năng: chặn bundle JS/CSS phình to (đo brotli, không tệ hơn
      # hiện tại). Đo trên dist vừa build ở bước trên. Xem .size-limit.json.
      - name: Bundle size budget (size-limit)
        run: npm run size

      # Ngân sách CHUNK CHƯƠNG bài học STEM. Tách khỏi size-limit ở trên vì đo thứ khác:
      # size-limit canh initial bundle (thứ MỌI người tải), còn cổng này canh từng chunk nạp
      # lười theo chương (thứ người học tải khi mở đúng chương đó). Thay cho tiêu chí cũ đo
      # byte MÃ NGUỒN — xem đầu scripts/check-lesson-chunks.ts để biết vì sao tiêu chí đó sai.
      - name: Ngân sách chunk chương bài học
        run: npm run size:chunks

      # Boot check: server đã biên dịch (dist-server, phân giải @dhcb qua dist từng gói —
      # phương án B project references) phải KHỞI ĐỘNG được thật và trả /api/health 200.
      # Bắt lỗi phân giải module lúc runtime mà typecheck không thấy (exports/paths lệch).
      - name: Boot check server đã biên dịch
        run: |
          PORT=3199 NODE_ENV=production \
          DATABASE_URL="postgres://fake:fake@127.0.0.1:5/fake" \
          TTS_ENCRYPTION_MASTER_KEY="$(head -c32 /dev/zero | base64)" \
          node dist-server/server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf http://127.0.0.1:3199/api/health > /dev/null; then
              echo "✅ /api/health OK"; kill $SERVER_PID; exit 0
            fi
          done
          echo "❌ Server không trả /api/health sau 20s"; kill $SERVER_PID || true; exit 1

  # ── Nhánh 4: cổng bảo mật + kiến trúc (nhẹ, chạy riêng cho nhanh) ──────────
  audit:
    name: npm audit + chu trình import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Gate bảo mật dependency: 0 lỗ hổng ở production deps (tiêu chuẩn N5, 2026-08-23).
      # devDependencies vá qua overrides trong package.json, không chặn ở đây.
      #
      # VÁ TẠM (2026-09-19, sự cố hạ tầng npm registry): endpoint audit của npm (cả "quick"
      # lẫn "bulk" thay thế) trả lỗi 400/503 độc lập với nội dung lockfile — tái hiện y hệt
      # trên `main` VÀ ở máy cục bộ cùng lúc, không phải lỗ hổng thật hay lỗi của PR nào.
      # `npm audit` không phân biệt "registry lỗi" với "có lỗ hổng" qua exit code, nên tự đọc
      # output: CHỈ cho qua khi thấy đúng dấu hiệu "audit endpoint returned an error" (registry
      # phía server từ chối yêu cầu) — mọi lỗi khác (kể cả lỗ hổng thật tìm thấy) vẫn CHẶN như
      # cũ. Gỡ vá này khi npm registry ổn định lại (theo dõi qua status.npmjs.org).
      - name: npm audit (production deps, 0 lỗ hổng)
        run: |
          set +e
          OUT="$(npm audit --omit=dev 2>&1)"
          STATUS=$?
          echo "$OUT"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          if echo "$OUT" | grep -q "audit endpoint returned an error"; then
            echo "::warning::npm audit KHÔNG chạy được vì npm registry lỗi hạ tầng (endpoint audit trả về lỗi, không phải lỗ hổng thật) — tạm cho qua cổng này, cần chạy lại npm audit thủ công khi registry hồi phục (status.npmjs.org)."
            exit 0
          fi
          exit $STATUS

      # Gate kiến trúc: 0 chu trình import trong toàn repo (tiêu chuẩn N5, 2026-08-23).
      - name: Chu trình import (codemap cycles = 0)
        run: npm run codemap -- cycles | grep -q "Không có chu trình import"

      # Gate NỘI DUNG HỌC (thêm 2026-08-31): rà cả kho bài học/khoá/hướng/lộ trình cùng
      # lúc — bài mồ côi, khoá trỏ bài không tồn tại, hai bài cùng URL, bước ⑥ chép lại
      # bước ③. Cổng Zod + cổng chạy code mẫu chỉ nhìn TỪNG BÀI cô lập nên không thấy
      # lớp lỗi này. Đặt ở job `audit` vì nó nhẹ (~5 giây, hằng biên dịch, không I/O) và
      # job này là job ngắn nhất — không kéo dài đường tới hạn. Xem
      # docs/research/audit-chat-luong-bai-hoc-2026-08-31.md.
      - name: Chất lượng nội dung bài học (audit:lessons)
        run: npm run audit:lessons -- --ci
      - name: Câu chữ nội dung học (audit:prose)
        run: npm run audit:prose -- --ci

      # Gate chống đặc tả "nói suông" (thêm 2026-09-19, tham khảo spec-compiler của
      # seeker19110/projects-template): mọi đường dẫn trong cột "Đường dẫn file" của mục
      # ② ở đặc tả ĐÃ "Approved for implementation" phải tồn tại thật trong repo — CLAUDE.md
      # mục 5 "chống ảo giác" trước đây chỉ dựa kỷ luật, không có gác tự động cho nội dung
      # đặc tả. Xem scripts/check-spec-paths.ts.
      - name: Đường dẫn trong đặc tả Approved (check:specs)
        run: npm run check:specs -- --ci

      # Workflow Controller cơ học của AI_DEVELOPMENT_PROTOCOL.md §12 mục 1: spec nào tự khai
      # `Trạng thái: **XXX**` phải đủ khối YAML hợp đồng đúng schema §3 cho trạng thái đó (spec
      # cũ không có dòng này thì bỏ qua, hợp lệ). Xem scripts/protocol-check.ts.
      - name: Hợp đồng AI_DEVELOPMENT_PROTOCOL.md (check:protocol)
        run: npm run check:protocol -- --ci

      # Lệnh/agent ↔ CLAUDE.md khớp hai chiều (thêm 2026-09-21, áp từ
      # seeker19110/projects-template scripts/check-docs-consistency.sh, rút gọn cho DHCB — xem
      # CLAUDE.md mục 7). Bắt lỗi kiểu "thêm .claude/commands/x.md mà quên khai trong CLAUDE.md".
      - name: Lệnh/agent ↔ CLAUDE.md (check:docs)
        run: npm run check:docs

      # Cảnh báo PROGRESS.md lỗi thời (TRAPS.md mục 2) — chỉ đối chiếu khi push thẳng main:
      # lúc PR còn mở, nhánh feature vẫn tồn tại là bình thường, kiểm lúc đó báo oan. Cần
      # fetch-depth đủ để `git ls-remote` thấy remote thật (actions/checkout mặc định đã fetch
      # origin nên không cần cấu hình thêm). Ở dạng CẢNH BÁO, không chặn merge — xem
      # docs/specs/2026-09-12-traps-va-kiem-progress-loi-thoi.md.
      - name: PROGRESS.md lỗi thời (cảnh báo)
        if: github.event_name == 'push'
        run: bash scripts/check-progress-freshness.sh

  # ── Nhánh 5: câu SQL tĩnh PREPARE được trên Postgres THẬT ─────────────────
  # Thêm 2026-10-08 (chủ dự án duyệt, changelog 0529). Unit test giả lập `pg` nên câu SQL sai
  # tên cột/bảng hay lệch kiểu vẫn xanh — changelog 0523 bắt tay 9 câu như vậy. Job này dựng
  # Postgres 16 rỗng, áp schema + migration bằng ĐÚNG lệnh deploy dùng (`npm run migrate:pg`,
  # scripts/deploy.sh) rồi PREPARE mọi câu SQL tĩnh trích từ `.query(` trong apps/server/src +
  # packages. Ngoại lệ có lý do: scripts/sql-prepare-allowlist.json. Chạy riêng một job vì cần
  # service container; nhẹ (~vài giây sau npm ci), không kéo dài đường tới hạn.
  sql-prepare:
    name: SQL PREPARE trên Postgres thật
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dhcb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dhcb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Mật khẩu chỉ của container dùng một lần trong job — không phải bí mật.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dhcb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Áp schema + migration (migrate:pg — cùng đường với deploy)
        run: npm run migrate:pg

      - name: PREPARE mọi câu SQL tĩnh (check:sql)
        run: npm run check:sql

  # ── Job TỔNG HỢP: đây là required status check `quality` ───────────────────
  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: [static, unit, build, audit, sql-prepare]
    if: ${{ !cancelled() }}
    steps:
      - name: Gom kết quả 5 nhánh
        run: |
          echo "static=${{ needs.static.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "build=${{ needs.build.result }}"
          echo "audit=${{ needs.audit.result }}"
          echo "sql-prepare=${{ needs.sql-prepare.result }}"
          if [ "${{ needs.static.result }}" != "success" ] \
            || [ "${{ needs.unit.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.audit.result }}" != "success" ] \
            || [ "${{ needs.sql-prepare.result }}" != "success" ]; then
            echo "❌ Có nhánh chất lượng KHÔNG xanh"; exit 1
          fi
          echo "✅ Toàn bộ cổng chất lượng xanh"

  # ── E2E chia 6 mảnh chạy song song ─────────────────────────────────────────
  #
  # VÌ SAO 6 CHỨ KHÔNG 4 (đo thật ở run của PR #713, không phải ước lượng):
  #   mảnh 1 ~2m24 · mảnh 2 ~2m32 · mảnh 3 ~1m57 · mảnh 4 **4m16**
  # Playwright chia mảnh theo SỐ TEST, không theo THỜI GIAN — mảnh 4 ôm cụm test nặng
  # (`programming-lesson.spec.ts`: SQLite/WASM + Worker trong trình duyệt) nên lệch 1,5 lần
  # so với trung bình và một mình nó quyết định thời gian tường của cả CI.
  # Chia nhỏ hơn = cụm nặng bị tách ra, mảnh chậm nhất tụt xuống gần mức trung bình.
  # Giá phải trả: thêm 2 runner × ~40 giây phí cố định (checkout + npm ci + cài Chromium).
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Trên CI không có Chromium cài sẵn → tự cài (playwright.config.ts sẽ tự
      # bỏ executablePath khi đường dẫn /opt/pw-browsers không tồn tại).
      #
      # CACHE trình duyệt theo phiên bản @playwright/test (đo run 33537608110 ngày
      # 2026-09-01): tải Chromium mất ~22 giây MỖI mảnh, và một mảnh kẹt tải tới 10,5 phút
      # — một mình nó kéo CI từ ~5 phút lên 13,8 phút. Cache trúng thì chỉ còn cài dependency
      # hệ thống (install-deps), không tải trình duyệt nữa. Khoá cache đổi theo phiên bản
      # gói nên nâng Playwright là tự tải bản mới, không dùng nhầm bản cũ.
      - name: Phiên bản Playwright (khoá cache)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cache trúng, không tải trình duyệt)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (Playwright + axe) — mảnh ${{ matrix.shard }}/6
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/6

      # CHỈ upload khi ĐỎ. Đo ở run PR #713: upload báo cáo 6,4 MB của một mảnh XANH mất
      # **29 giây** — hơn 8% thời gian tường của cả CI, để tạo ra một file không ai mở.
      # `failure()` (thay cho `!cancelled()` trước đây) giữ nguyên giá trị chẩn đoán khi đỏ.
      - name: Upload Playwright report (CHỈ khi mảnh này đỏ)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # ── Job TỔNG HỢP: đây là required status check `e2e` ───────────────────────
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [e2e-shard]
    if: ${{ !cancelled() }}
    steps:
      - name: Gom kết quả các mảnh E2E
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "❌ Có mảnh E2E KHÔNG xanh"; exit 1
          fi
          echo "✅ Toàn bộ 6 mảnh E2E xanh"
