name: Deploy to VPS

# Deploy NGAY khi có push lên main (chủ yếu là merge PR) — không đợi workflow CI (chạy lại
# trên push main) hoàn tất nữa. Trước đây trigger qua `workflow_run` sau khi CI trên main
# xong (PR #173: sửa vụ CI đỏ mà deploy vẫn chạy do 2 trigger độc lập) — nhưng branch
# protection trên `main` đã YÊU CẦU 2 check `quality`/`e2e` xanh TRƯỚC KHI merge được, nên
# lượt CI chạy lại trên push main chỉ là double-check dư thừa, làm chậm deploy vô ích.
# Nếu sau này bỏ/nới lỏng branch protection, cần trả lại cơ chế đợi CI như cũ.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nhiều lần push/merge lên main gần nhau → nhiều job deploy có thể được GitHub Actions chạy
# SONG SONG (mặc định không tự xếp hàng), cả 2 cùng SSH vào VPS pull/build/reload PM2 cùng
# lúc → đụng nhau. concurrency group ép các lần deploy XẾP HÀNG (cancel-in-progress: false =
# không huỷ lần đang chạy, lần sau đợi lần trước xong).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        # Ghim theo commit SHA, không theo tag: action này cầm SSH key VPS, tag có thể bị chủ
        # action dời sang commit khác (changelog 0521). Dependabot vẫn cập nhật SHA + chú thích.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/dhcb
            if [ -n "${GITHUB_TOKEN}" ]; then
              git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main --prune --tags
              git checkout -f -B main FETCH_HEAD
              git reset --hard FETCH_HEAD
            fi
            GITHUB_TOKEN="${GITHUB_TOKEN}" GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" bash scripts/deploy.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
