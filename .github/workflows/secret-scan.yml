name: Secret scan

# Tự động hoá luật "bí mật KHÔNG bao giờ vào Git" (CLAUDE.md mục 4 nguyên tắc 6 + mục 8 cổng
# commit). Trước đây chỉ dựa vào .gitignore + con người tự soát — gitleaks quét diff/commit để
# chặn rò rỉ API key/token/mật khẩu trước khi vào main. Không phải required check của branch
# protection (CLAUDE.md mục 11 chỉ có quality/e2e/metadata) — đỏ ở đây là cảnh báo cần xem ngay,
# không tự chặn merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Chạy tay toàn bộ lịch sử (changelog 0621): sau khi xoay vòng một khoá bị lộ, hoặc khi nghi ngờ —
  # không phải chờ tới lần push kế tiếp.
  workflow_dispatch:

# gitleaks-action đọc danh sách commit của PR qua API → cần quyền đọc PR.
# Thiếu quyền này gây lỗi 403 "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Lấy đủ lịch sử để quét được toàn bộ commit trong PR/push.
          fetch-depth: 0

      - name: Quét bí mật (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Miễn phí cho repo cá nhân & repo public. Repo tổ chức cần GITLEAKS_LICENSE.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
